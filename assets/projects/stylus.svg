<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 164" width="430" height="164" role="img" aria-label="Stylus — Figma Design Preview">
  <defs>
    <linearGradient id="stBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#191632" />
    </linearGradient>
    <radialGradient id="stGlow" cx="75%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="penStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="428" height="162" rx="12" fill="url(#stBg)" stroke="#293548" stroke-width="1.2" />
  <rect x="1" y="1" width="428" height="162" rx="12" fill="url(#stGlow)" />

  <!-- Top Pill Badge -->
  <rect x="308" y="16" width="104" height="22" rx="11" fill="#A78BFA" fill-opacity="0.14" stroke="#A78BFA" stroke-opacity="0.4" />
  <text x="360" y="30.5" text-anchor="middle" fill="#DDD6FE" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="0.6">FIGMA DESIGN</text>

  <!-- Left UI Canvas Frame -->
  <rect x="24" y="24" width="224" height="116" rx="10" fill="#182035" stroke="#2F3B57" stroke-width="1" />
  <!-- Bezier Curve -->
  <path d="M46 112 C 74 44, 152 126, 206 58" fill="none" stroke="url(#penStroke)" stroke-width="2.5" stroke-linecap="round" />
  <!-- Control Handles -->
  <line x1="46" y1="112" x2="74" y2="54" stroke="#64748B" stroke-width="1.2" stroke-dasharray="3 3" />
  <line x1="206" y1="58" x2="178" y2="96" stroke="#64748B" stroke-width="1.2" stroke-dasharray="3 3" />
  <circle cx="74" cy="54" r="3.5" fill="#F472B6" />
  <circle cx="178" cy="96" r="3.5" fill="#A78BFA" />
  <rect x="42" y="108" width="8" height="8" rx="1.5" fill="#0F172A" stroke="#A78BFA" stroke-width="1.6" />
  <rect x="202" y="54" width="8" height="8" rx="1.5" fill="#0F172A" stroke="#F472B6" stroke-width="1.6" />

  <!-- Right Stylus / Pen Tool Artboard -->
  <rect x="264" y="52" width="146" height="88" rx="10" fill="#182035" stroke="#2F3B57" stroke-width="1" />
  <!-- Stylus Pen Vector -->
  <g transform="translate(312, 64)">
    <path d="M42 4 L50 12 L18 44 L6 48 L10 36 Z" fill="#A78BFA" fill-opacity="0.22" stroke="#C4B5FD" stroke-width="1.6" stroke-linejoin="round" />
    <line x1="34" y1="12" x2="42" y2="20" stroke="#F472B6" stroke-width="1.6" />
    <circle cx="6" cy="48" r="2.2" fill="#F472B6" />
  </g>
  <rect x="282" y="122" width="110" height="5" rx="2.5" fill="#475569" />
</svg>

