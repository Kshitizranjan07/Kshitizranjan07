<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Kshitiz Ranjan — Undergraduate Designer, B.Des UXID at MUJ">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="55%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <radialGradient id="glowLeft" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.45" />
    </pattern>
  </defs>

  <!-- Canvas Container -->
  <rect x="2" y="2" width="896" height="236" rx="18" fill="url(#bgGrad)" stroke="#263042" stroke-width="1.5" />
  <rect x="2" y="2" width="896" height="236" rx="18" fill="url(#dotGrid)" />
  <rect x="2" y="2" width="896" height="236" rx="18" fill="url(#glowLeft)" />
  <rect x="2" y="2" width="896" height="236" rx="18" fill="url(#glowRight)" />

  <!-- Figma Selection Frame Badge -->
  <g>
    <rect x="48" y="42" width="186" height="28" fill="#6366F1" fill-opacity="0.12" stroke="#818CF8" stroke-width="1" />
    <rect x="45" y="39" width="6" height="6" fill="#0B0F17" stroke="#818CF8" stroke-width="1.2" />
    <rect x="231" y="39" width="6" height="6" fill="#0B0F17" stroke="#818CF8" stroke-width="1.2" />
    <rect x="45" y="67" width="6" height="6" fill="#0B0F17" stroke="#818CF8" stroke-width="1.2" />
    <rect x="231" y="67" width="6" height="6" fill="#0B0F17" stroke="#818CF8" stroke-width="1.2" />
    <text x="141" y="60" text-anchor="middle" fill="#C7D2FE" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.4">B.DES · UXID · MUJ</text>
  </g>

  <!-- Main Typography -->
  <text x="48" y="120" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-0.8">Kshitiz Ranjan</text>
  <text x="48" y="152" fill="#CBD5E1" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16" font-weight="500">Undergraduate Design Student · Specialization in UXID</text>
  <text x="48" y="180" fill="#94A3B8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">User Experience · Interface Design · Design Audits · Information Architecture</text>

  <!-- Accent Line -->
  <rect x="48" y="200" width="140" height="3" rx="1.5" fill="url(#accentGrad)" />

  <!-- Right Side: Minimalist UX Artboard Visual -->
  <text x="594" y="29" fill="#64748B" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5"># figma_workspace</text>
  <g>
    <rect x="594" y="38" width="260" height="168" rx="12" fill="#131B29" stroke="#2D3A4F" stroke-width="1.2" />
    <!-- Top Bar -->
    <rect x="594" y="38" width="260" height="28" rx="12" fill="#1A2436" />
    <rect x="594" y="54" width="260" height="12" fill="#1A2436" />
    <line x1="594" y1="66" x2="854" y2="66" stroke="#283549" stroke-width="1" />
    <circle cx="612" cy="52" r="4" fill="#F43F5E" fill-opacity="0.8" />
    <circle cx="626" cy="52" r="4" fill="#F59E0B" fill-opacity="0.8" />
    <circle cx="640" cy="52" r="4" fill="#10B981" fill-opacity="0.8" />
    <!-- Mini Figma Mark in Header -->
    <g transform="translate(824, 43) scale(0.75)">
      <path d="M5 12a3 3 0 0 1 3-3h3v6H8a3 3 0 0 1-3-3z" fill="#A259FF"/>
      <path d="M5 6a3 3 0 0 1 3-3h3v6H8a3 3 0 0 1-3-3z" fill="#F24E1E"/>
      <path d="M11 3h3a3 3 0 0 1 0 6h-3V3z" fill="#FF7262"/>
      <circle cx="14" cy="12" r="3" fill="#1ABCFE"/>
      <path d="M5 18a3 3 0 0 1 3-3h3v3a3 3 0 0 1-6 0z" fill="#0ACF83"/>
    </g>

    <!-- Inside Artboard: Grid & Wireframe Cards -->
    <rect x="610" y="80" width="108" height="52" rx="7" fill="#1D283A" stroke="#334155" stroke-width="1" />
    <rect x="620" y="90" width="44" height="6" rx="3" fill="#38BDF8" fill-opacity="0.85" />
    <rect x="620" y="102" width="84" height="5" rx="2.5" fill="#475569" />
    <rect x="620" y="113" width="66" height="5" rx="2.5" fill="#334155" />

    <rect x="728" y="80" width="110" height="52" rx="7" fill="#1D283A" stroke="#334155" stroke-width="1" />
    <!-- Bezier Pen Path -->
    <path d="M744 116 C 764 88, 796 122, 822 96" fill="none" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" />
    <line x1="744" y1="116" x2="764" y2="94" stroke="#64748B" stroke-width="1" stroke-dasharray="2 2" />
    <circle cx="744" cy="116" r="3.5" fill="#0B0F17" stroke="#A78BFA" stroke-width="1.5" />
    <circle cx="822" cy="96" r="3.5" fill="#0B0F17" stroke="#A78BFA" stroke-width="1.5" />
    <circle cx="764" cy="94" r="2.5" fill="#38BDF8" />

    <!-- Bottom Interactive Component Strip -->
    <rect x="610" y="144" width="228" height="46" rx="7" fill="#1D283A" stroke="#334155" stroke-width="1" />
    <!-- Component Diamond Icon -->
    <g transform="translate(626, 159)">
      <polygon points="8,0 12,4 8,8 4,4" fill="#A78BFA" />
      <polygon points="0,8 4,12 0,16 -4,12" transform="translate(4,0)" fill="#A78BFA" fill-opacity="0.7" />
      <polygon points="12,8 16,12 12,16 8,12" fill="#A78BFA" fill-opacity="0.7" />
      <polygon points="8,16 12,20 8,24 4,20" transform="translate(0,-4)" fill="#A78BFA" />
    </g>
    <rect x="652" y="159" width="78" height="6" rx="3" fill="#E2E8F0" fill-opacity="0.85" />
    <rect x="652" y="171" width="112" height="5" rx="2.5" fill="#64748B" />

    <!-- Cursor Icon -->
    <g transform="translate(796, 152)">
      <path d="M2 2 L16 10 L10 12 L8 18 Z" fill="#38BDF8" stroke="#0B0F17" stroke-width="1.5" stroke-linejoin="round" />
      <rect x="14" y="16" width="38" height="15" rx="4" fill="#38BDF8" />
      <text x="33" y="26.5" text-anchor="middle" fill="#0B0F17" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700">UXID</text>
    </g>
  </g>
</svg>

